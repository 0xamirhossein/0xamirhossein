<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Dark Cyberpunk Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Vibrant Electric Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Neon Accent Lines Gradient -->
    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur"/>
    </filter>

    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#818CF8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#tech-grid)"/>

  <!-- Ambient Light Orbs (Glow Background) -->
  <circle cx="200" cy="80" r="140" fill="#0284C7" opacity="0.3" filter="url(#glow-heavy)"/>
  <circle cx="1000" cy="260" r="160" fill="#7C3AED" opacity="0.3" filter="url(#glow-heavy)"/>
  <circle cx="600" cy="170" r="100" fill="#6366F1" opacity="0.15" filter="url(#glow-heavy)"/>

  <!-- Tech Geometric Circuit Overlay -->
  <g stroke="url(#neon-line)" stroke-width="1.5" opacity="0.4">
    <path d="M 50 100 L 150 100 L 200 150 L 350 150" fill="none"/>
    <path d="M 1150 240 L 1050 240 L 1000 190 L 850 190" fill="none"/>
    <circle cx="350" cy="150" r="3" fill="#38BDF8"/>
    <circle cx="850" cy="190" r="3" fill="#C084FC"/>
  </g>

  <!-- Main Glassmorphism Terminal Card -->
  <rect x="50" y="35" width="1100" height="270" rx="20" fill="url(#glass)" stroke="url(#glass-border)" stroke-width="1.5"/>

  <!-- Terminal Window Controls (Top Left of Glass Card) -->
  <g transform="translate(80, 58)">
    <circle cx="0" cy="0" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="20" cy="0" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="40" cy="0" r="6" fill="#10B981" opacity="0.8"/>
    <text x="65" y="4" font-family="'Fira Code', monospace" font-size="12" fill="#64748B" font-weight="600">amir-hosein ~ profile.dev</text>
  </g>

  <!-- Decorative Code Accent (Top Right) -->
  <text x="1100" y="62" text-anchor="end" font-family="'Fira Code', monospace" font-size="13" fill="#818CF8" opacity="0.6">&lt;backend_engineer/&gt;</text>

  <!-- Title: Amir Hosein (With Dual-Layer Glow Effect) -->
  <g text-anchor="middle">
    <!-- Glow Underlay -->
    <text x="600" y="145" font-family="'Fira Code', monospace" font-size="50" font-weight="800" fill="url(#title-grad)" opacity="0.6" filter="url(#glow-soft)" letter-spacing="2">
       SEYED AMIRHOSSEIN BAGHERHOSSEINI
    </text>
    <!-- Crisp Foreground Text -->
    <text x="600" y="145" font-family="'Fira Code', monospace" font-size="50" font-weight="800" fill="url(#title-grad)" letter-spacing="2">
      SEYED AMIRHOSSEIN BAGHERHOSSEINI
    </text>

    <!-- Subtitle / Role -->
    <text x="600" y="192" font-family="'Fira Code', monospace" font-size="22" font-weight="600" fill="#F1F5F9" letter-spacing="1">
      Computer Engineering Student <tspan fill="#38BDF8">•</tspan> ASP.NET Core Backend Learner
    </text>
  </g>

  <!-- Tech Stack Badges (Pills) -->
  <g transform="translate(600, 222)">
    <!-- Tech 1: C# / .NET -->
    <g transform="translate(-240, 0)">
      <rect x="0" y="0" width="110" height="32" rx="8" fill="#512BD4" fill-opacity="0.25" stroke="#512BD4" stroke-width="1.5"/>
      <text x="55" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#C4B5FD">⚡ C# / .NET</text>
    </g>

    <!-- Tech 2: Python -->
    <g transform="translate(-115, 0)">
      <rect x="0" y="0" width="105" height="32" rx="8" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="52" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#38BDF8">🐍 Python</text>
    </g>

    <!-- Tech 3: ASP.NET Core -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1.5"/>
      <text x="67" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#A5B4FC">🌐 ASP.NET Core</text>
    </g>

    <!-- Tech 4: System Design -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#C084FC" fill-opacity="0.2" stroke="#C084FC" stroke-width="1.5"/>
      <text x="67" y="21" text-anchor="middle" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#E9D5FF">🏗 System Design</text>
    </g>
  </g>

  <!-- Bottom Accent Separator Line -->
  <line x1="450" y1="282" x2="750" y2="282" stroke="url(#neon-line)" stroke-width="2" stroke-linecap="round"/>
</svg>
